[package]
name = "tiktok-live-ai-avatar"
version = "1.0.0"
description = "TikTok Live AI Avatar with Gemini Live API"
authors = ["you"]
edition = "2021"

[lib]
name = "tiktok_live_ai_avatar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
